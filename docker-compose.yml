# Quiz App en local : frontend (nginx) -> backend (Node.js) -> db (PostgreSQL).
# Les valeurs ${...} viennent du fichier .env (non versionné, voir .env.example).
# La syntaxe ${VAR:?message} bloque le démarrage si la variable est absente ou vide.

name: quiz-app

services:
  # ---------- Base de données ----------
  db:
    # Image officielle épinglée, durcie dans database/Dockerfile (sans gosu, schéma intégré)
    build:
      context: ./database
    image: quiz-db:local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER doit être défini dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB doit être défini dans .env}
    volumes:
      # Volume nommé : les données survivent à la recréation du conteneur.
      # PostgreSQL 18 : le point de montage est /var/lib/postgresql
      # (PGDATA=/var/lib/postgresql/18/docker), et non plus /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
      # Le schéma database/init.sql est copié dans l'image : il est exécuté une seule
      # fois, au premier démarrage sur un volume vide.
    # Pas de "ports:" : la base n'est joignable que par le backend, sur le réseau du projet.
    healthcheck:
      # $$ : la variable est lue dans le conteneur, pas remplacée par Compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    # Le conteneur démarre directement avec l'utilisateur postgres (USER de l'image) :
    # aucune capacité Linux n'est nécessaire.
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: 1.0
          pids: 100
    restart: unless-stopped

  # ---------- API ----------
  backend:
    build:
      context: ./backend
    image: quiz-backend:local
    environment:
      # "db" est le nom du service PostgreSQL, résolu par le DNS du réseau du projet.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Obligatoire : sans clé, le backend plante au démarrage (Missing API key).
      # Une valeur factice suffit si aucun accès Resend n'est fourni.
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY doit être défini dans .env}
      FROM_EMAIL: ${FROM_EMAIL:-Quiz App <noreply@example.com>}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME doit être défini dans .env}
      # Obligatoires : le code a des valeurs par défaut publiques (admin123, change-this-secret).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD doit être défini dans .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit être défini dans .env}
    depends_on:
      db:
        # Attend que la base accepte les connexions, pas seulement que le conteneur soit lancé.
        condition: service_healthy
    # Pas de "ports:" : le backend n'est joint que par nginx.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: 0.5
          pids: 100
    restart: unless-stopped

  # ---------- Frontend ----------
  frontend:
    build:
      context: .
    image: quiz-frontend:local
    ports:
      # Seul port publié sur l'hôte. nginx écoute sur 8080 (utilisateur non-root).
      - "${FRONTEND_PORT:-8087}:8080"
    depends_on:
      backend:
        # nginx refuse de démarrer s'il ne peut pas résoudre "backend".
        condition: service_healthy
    read_only: true
    tmpfs:
      # nginx y écrit son PID et ses fichiers temporaires.
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: 0.5
          pids: 50
    restart: unless-stopped

volumes:
  pgdata:
