# CD : publication et déploiement après fusion dans main.
#
# - reconstruit les images à partir du commit fusionné ;
# - les analyse de nouveau avec Trivy (bloquant sur CRITICAL) ;
# - les publie dans Azure Container Registry, avec le commit Git comme tag ;
# - met à jour les deux applications Azure Container Apps ;
# - vérifie que la nouvelle version répond.
#
# Ce workflow ne s'exécute jamais sur une Pull Request : seul le code fusionné
# dans main, donc relu et contrôlé par la CI, est déployé.
#
# Connexion à Azure sans secret (OIDC) : voir scripts/setup-github-oidc.sh.

name: CD

on:
  push:
    branches: [main]
    # Une modification de documentation ou de preuves ne redéploie pas l'application.
    paths-ignore:
      - "docs/**"
      - "preuves/**"
      - "**.md"
  # Permet de relancer un déploiement à la main depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: read
  # Autorise le job à demander le jeton OIDC que GitHub échange auprès d'Azure.
  id-token: write

# Un seul déploiement à la fois ; un déploiement en cours n'est pas interrompu.
concurrency:
  group: cd-azure
  cancel-in-progress: false

jobs:
  deploy:
    name: Publication ACR et déploiement Container Apps
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Récupération du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Les noms des ressources viennent de scripts/config.sh, comme pour deploy.sh.
      - name: Paramètres
        run: |
          source scripts/config.sh
          tag="${GITHUB_SHA::7}"
          server="$ACR_NAME.azurecr.io"
          {
            echo "RESOURCE_GROUP=$RESOURCE_GROUP"
            echo "ACR_NAME=$ACR_NAME"
            echo "BACKEND_APP=$BACKEND_APP"
            echo "FRONTEND_APP=$FRONTEND_APP"
            echo "IMAGE_TAG=$tag"
            echo "BACKEND_IMAGE=$server/$BACKEND_REPO:$tag"
            echo "FRONTEND_IMAGE=$server/$FRONTEND_REPO:$tag"
          } >> "$GITHUB_ENV"

      - name: Construction des images
        run: |
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$BACKEND_IMAGE" -t quiz-backend:cd ./backend
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$FRONTEND_IMAGE" -t quiz-frontend:cd .

      # Dernière barrière avant publication : une image avec une CRITICAL n'est pas poussée.
      - name: Scan Trivy (bloquant sur CRITICAL)
        env:
          SCAN_OUTPUT_DIR: ${{ runner.temp }}/trivy
        run: scripts/scan-trivy.sh cd quiz-backend:cd quiz-frontend:cd

      - name: Rapports Trivy
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-cd
          path: ${{ runner.temp }}/trivy/
          if-no-files-found: warn

      # Les trois valeurs sont des identifiants, pas des secrets : variables du dépôt.
      - name: Connexion à Azure (OIDC, sans secret)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publication dans ACR
        run: |
          az acr login --name "$ACR_NAME"
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"

      # Chaque mise à jour d'image crée une nouvelle révision.
      # Le backend d'abord : nginx doit le trouver prêt.
      - name: Mise à jour du backend
        run: |
          az containerapp update --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP" \
            --image "$BACKEND_IMAGE" \
            --query "{application:name, revision:properties.latestRevisionName, etat:properties.provisioningState}" -o table

      - name: Mise à jour du frontend
        run: |
          az containerapp update --name "$FRONTEND_APP" --resource-group "$RESOURCE_GROUP" \
            --image "$FRONTEND_IMAGE" \
            --query "{application:name, revision:properties.latestRevisionName, etat:properties.provisioningState}" -o table

      - name: Vérification de la nouvelle version
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show --name "$FRONTEND_APP" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)"
          url="https://$fqdn"
          echo "APP_URL=$url" >> "$GITHUB_ENV"

          status=000
          for attempt in $(seq 1 18); do
            status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url/health" || true)"
            [ "$status" = "200" ] && break
            echo "Tentative $attempt : HTTP $status"
            sleep 10
          done
          test "$status" = "200"

          for app in "$BACKEND_APP" "$FRONTEND_APP"; do
            az containerapp revision list --name "$app" --resource-group "$RESOURCE_GROUP" \
              --query "[?properties.active].{revision:name, image:properties.template.containers[0].image, sante:properties.healthState, trafic:properties.trafficWeight}" -o table
          done

      - name: Résumé du déploiement
        if: always()
        run: |
          {
            echo "### Déploiement"
            echo
            echo "| Élément | Valeur |"
            echo "|---|---|"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Tag des images | \`$IMAGE_TAG\` |"
            echo "| Backend | \`$BACKEND_IMAGE\` |"
            echo "| Frontend | \`$FRONTEND_IMAGE\` |"
            echo "| Application | ${APP_URL:-non vérifiée} |"
          } >> "$GITHUB_STEP_SUMMARY"
